---
# Valeurs par défaut du rôle Alloy.
# Surcharger dans group_vars ou host_vars si nécessaire.
# Ne pas stocker de secrets en clair dans ce fichier.

# ---------------------------------------------------------------------------
# Utilisateur et configuration
# ---------------------------------------------------------------------------
alloy_user: alloy
alloy_group: alloy

alloy_config_dir: /etc/alloy
alloy_data_dir: /var/lib/alloy

# ---------------------------------------------------------------------------
# Réseau / service
# ---------------------------------------------------------------------------
alloy_http_port: 12345
alloy_listen_address: "127.0.0.1:{{ alloy_http_port }}"

# Endpoint Loki : adresse privée de obs_dashboard.
# Loki devra être déployé et accessible avant la validation de l'envoi.
alloy_loki_url: "http://172.31.35.92:3100/loki/api/v1/push"

# ---------------------------------------------------------------------------
# Collecte des logs
# ---------------------------------------------------------------------------
# Configuration initiale pour un hôte Linux.
# La collecte des logs Kubernetes sera configurée séparément.
alloy_log_paths:
  - /var/log/*.log
  - /var/log/syslog
  - /var/log/auth.log