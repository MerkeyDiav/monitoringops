---
# Rôle Loki : installation, configuration et vérification du service.
# Les paramètres sont définis dans defaults/main.yml.

# ---------------------------------------------------------------------------
# Téléchargement et installation du binaire Loki
# ---------------------------------------------------------------------------
- name: Install prerequisites for Loki
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - unzip
    state: present
    update_cache: true

- name: Download Loki binary
  become: true
  ansible.builtin.get_url:
    url: "{{ loki_release_url }}"
    dest: "/tmp/{{ loki_release_name }}.zip"
    mode: "0644"

- name: Extract Loki archive
  become: true
  ansible.builtin.command:
    cmd: "unzip -o /tmp/{{ loki_release_name }}.zip -d /tmp"
    creates: "/tmp/{{ loki_release_name }}"

- name: Find Loki binary
  become: true
  ansible.builtin.find:
    paths: "/tmp/{{ loki_release_name }}"
    patterns: "loki"
    file_type: file
  register: loki_binary_find

- name: Display found Loki binary
  ansible.builtin.debug:
    var: loki_binary_find.files[0].path

- name: Install Loki binary
  become: true
  ansible.builtin.copy:
    src: "{{ loki_binary_find.files[0].path }}"
    dest: "{{ loki_bin_dir }}/loki"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Create Loki user and group
  become: true
  ansible.builtin.group:
    name: "{{ loki_group }}"
    system: true
    state: present

- name: Create Loki user
  become: true
  ansible.builtin.user:
    name: "{{ loki_user }}"
    group: "{{ loki_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ loki_data_dir }}"
    state: present

# ---------------------------------------------------------------------------
# Configuration
# ---------------------------------------------------------------------------
- name: Ensure Loki directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: "0750"
  loop:
    - "{{ loki_config_dir }}"
    - "{{ loki_data_dir }}"
    - "{{ loki_log_dir }}"

- name: Deploy Loki configuration
  become: true
  ansible.builtin.template:
    src: loki-local-config.yaml.j2
    dest: "{{ loki_config_dir }}/loki-local-config.yaml"
    owner: root
    group: "{{ loki_group }}"
    mode: "0640"
  notify: Restart loki

- name: Deploy Loki systemd service
  become: true
  ansible.builtin.template:
    src: loki.service.j2
    dest: "/etc/systemd/system/loki.service"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# ---------------------------------------------------------------------------
# Démarrage et vérification
# ---------------------------------------------------------------------------
- name: Enable and start Loki service
  become: true
  ansible.builtin.systemd:
    name: loki
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Loki to be ready
  become: true
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ loki_port }}/ready"
    method: GET
    status_code: 200
  register: loki_ready
  retries: 15
  delay: 2
  until: loki_ready.status == 200

- name: Display Loki status
  ansible.builtin.debug:
    msg: "Loki est prêt sur le port {{ loki_port }}"