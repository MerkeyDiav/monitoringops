---
# Valeurs par défaut du rôle node_exporter.
# Elles ont la priorité la plus faible : on les surcharge dans
# group_vars/<groupe>.yml, host_vars/<hôte>.yml ou avec -e "var=valeur".

# Version à installer. Pour une mise à niveau, il suffit de changer cette valeur :
# un nouveau répertoire /opt/node_exporter-<version>.linux-<arch> est extrait,
# le binaire est remplacé et le service redémarré automatiquement.
node_exporter_version: "1.8.2"

# Port d'écoute HTTP (métriques sur http://<ip>:<port>/metrics)
node_exporter_port: 9100
node_exporter_listen_address: "0.0.0.0:{{ node_exporter_port }}"

# Compte système dédié (identique sur Ubuntu, Amazon Linux, RHEL...)
node_exporter_user: node_exporter
node_exporter_group: node_exporter

# Architecture des binaires publiés sur GitHub (amd64, arm64...).
# Déduite automatiquement de ansible_architecture ; amd64 si inconnue.
node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: arm
node_exporter_arch: "{{ node_exporter_arch_map[ansible_architecture] | default('amd64') }}"

# Chemins
node_exporter_install_dir: /opt
node_exporter_binary_path: /usr/local/bin/node_exporter

# Arguments supplémentaires passés au binaire, par exemple :
#   node_exporter_extra_args:
#     - "--collector.systemd"
#     - "--no-collector.wifi"
node_exporter_extra_args: []

# Variables dérivées (normalement pas besoin de les surcharger)
node_exporter_release_name: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_download_base: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
node_exporter_archive_url: "{{ node_exporter_download_base }}/{{ node_exporter_release_name }}.tar.gz"
node_exporter_checksum_url: "{{ node_exporter_download_base }}/sha256sums.txt"
node_exporter_archive_path: "/tmp/{{ node_exporter_release_name }}.tar.gz"