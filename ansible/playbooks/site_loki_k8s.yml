---
# Déploiement de Loki sur Kubernetes via Helm.
# Le fichier values est copié sur le nœud distant avant l'exécution de Helm.

- name: Deploy Loki with Helm
  hosts: k8s_nodes
  become: false
  vars:
    loki_values_remote: "/tmp/loki-values-{{ k8s_namespace }}.yaml"
  tasks:
    - name: Ensure Grafana Helm repository is available
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - grafana
          - https://grafana.github.io/helm-charts
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"

    - name: Update Helm repositories
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
      register: helm_repo_update
      changed_when: "'Update Complete' in helm_repo_update.stdout"

    - name: Copy Loki values file to remote host
      ansible.builtin.copy:
        src: "{{ loki_helm_values }}"
        dest: "{{ loki_values_remote }}"
        mode: "0644"

    - name: Deploy Loki Helm chart
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - loki
          - grafana/loki
          - --namespace
          - "{{ k8s_namespace }}"
          - --create-namespace
          - --values
          - "{{ loki_values_remote }}"
      register: loki_helm_result
      changed_when: >-
        'has been upgraded' in loki_helm_result.stdout or
        'has been installed' in loki_helm_result.stdout

    - name: Display Helm deployment result
      ansible.builtin.debug:
        var: loki_helm_result.stdout