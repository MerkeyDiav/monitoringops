---
# Déploiement de Grafana Alloy sur Kubernetes via Helm.
# Le fichier values est copié sur le nœud distant avant l'exécution de Helm.
# L'URL Loki est injectée via --set pour éviter les valeurs en dur dans les fichiers values.

- name: Deploy Grafana Alloy with Helm
  hosts: k8s_nodes
  become: false
  vars:
    alloy_values_remote: "/tmp/alloy-values-{{ k8s_namespace }}.yaml"
  tasks:
    - name: Ensure Grafana Helm repository is available
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - grafana
          - https://grafana.github.io/helm-charts
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"

    - name: Update Helm repositories
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
      register: helm_repo_update
      changed_when: "'Update Complete' in helm_repo_update.stdout"

    - name: Copy Alloy values file to remote host
      ansible.builtin.copy:
        src: "{{ alloy_helm_values }}"
        dest: "{{ alloy_values_remote }}"
        mode: "0644"

    - name: Deploy Alloy Helm chart
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - alloy
          - grafana/alloy
          - --namespace
          - "{{ k8s_namespace }}"
          - --create-namespace
          - --values
          - "{{ alloy_values_remote }}"
          - --set
          - "loki.write.local.endpoint.url={{ alloy_loki_url }}"
      register: alloy_helm_result
      changed_when: >-
        'has been upgraded' in alloy_helm_result.stdout or
        'has been installed' in alloy_helm_result.stdout

    - name: Display Helm deployment result
      ansible.builtin.debug:
        var: alloy_helm_result.stdout