---
# Variables appliquées à toutes les machines du groupe [k8s_nodes].
# Elles surchargent les valeurs de playbooks/roles/node_exporter/defaults/main.yml.
# Pour une seule machine, créer host_vars/<nom_hôte>.yml.

node_exporter_version: "1.8.2"
node_exporter_port: 9100

# Collecteurs supplémentaires utiles sur un nœud Kubernetes
node_exporter_extra_args:
  - "--collector.systemd"
