---
all:
  children:
    k8s_nodes:
      hosts:
        k8s_lab:
          ansible_host: <PROD_K8S_LAB_IP>
          ansible_user: ubuntu
          ansible_ssh_private_key_file: /home/ec2-user/.ssh/ekey.pem

    observability_servers:
      hosts:
        obs_collector:
          ansible_host: <PROD_OBS_COLLECTOR_IP>
          ansible_user: ubuntu
          ansible_ssh_private_key_file: /home/ec2-user/.ssh/ekey.pem
        obs_dashboard:
          ansible_host: <PROD_OBS_DASHBOARD_IP>
          ansible_user: ubuntu
          ansible_ssh_private_key_file: /home/ec2-user/.ssh/ekey.pem

    # Serveurs Docker/Linux qui hébergent Alloy via le rôle Ansible
    # (collecte de logs système et/ou conteneurs Docker)
    alloy_collectors:
      hosts:
        obs_collector:
          ansible_host: <PROD_OBS_COLLECTOR_IP>
          ansible_user: ubuntu
          ansible_ssh_private_key_file: /home/ec2-user/.ssh/ekey.pem
        obs_dashboard:
          ansible_host: <PROD_OBS_DASHBOARD_IP>
          ansible_user: ubuntu
          ansible_ssh_private_key_file: /home/ec2-user/.ssh/ekey.pem