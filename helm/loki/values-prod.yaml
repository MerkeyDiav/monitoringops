# Valeurs Loki pour l'environnement PROD.
# Configuration adaptée à la production : rétention plus longue, HA désactivée par défaut.

loki:
  auth:
    enabled: false

  storage:
    type: filesystem
    filesystem:
      directory: /var/loki

  chunks:
    retention_period: 30d

  schema_config:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

ruler:
  storage:
    type: filesystem
    filesystem:
      directory: /var/loki/rules

gateway:
  enabled: true
  replicas: 1

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0